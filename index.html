<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星星地图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#01030a; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; }
  /* 星空背景 */
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.22), transparent),
      radial-gradient(1px 1px at 25% 78%, rgba(255,255,255,.15), transparent),
      radial-gradient(1.5px 1.5px at 55% 30%, rgba(180,210,255,.18), transparent),
      radial-gradient(1px 1px at 70% 12%, rgba(255,255,255,.14), transparent),
      radial-gradient(1.5px 1.5px at 82% 60%, rgba(200,220,255,.15), transparent),
      radial-gradient(1px 1px at 40% 52%, rgba(255,255,255,.12), transparent),
      radial-gradient(1px 1px at 92% 90%, rgba(255,255,255,.1), transparent),
      radial-gradient(1.5px 1.5px at 15% 66%, rgba(180,200,255,.12), transparent),
      radial-gradient(1px 1px at 63% 88%, rgba(255,255,255,.12), transparent),
      radial-gradient(2px 2px at 32% 10%, rgba(255,255,255,.1), transparent);
  }
  /* 顶部标题栏 */
  #topbar {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:14px 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none;
  }
  #title { color:#e8ecff; font-size:18px; font-weight:600; letter-spacing:1px; text-shadow:0 0 12px rgba(150,170,255,.4); }
  #title span { color:#8fa3ff; font-size:12px; font-weight:400; letter-spacing:.5px; margin-left:6px; }
  #legendBtn {
    pointer-events:auto; cursor:pointer;
    background:rgba(30,36,66,.75); border:1px solid rgba(140,160,255,.28); border-radius:20px;
    color:#c8d2ff; font-size:13px; padding:6px 13px; backdrop-filter:blur(6px);
  }
  /* 3D 球体容器 */
  #globe { position:absolute; inset:0; z-index:1; }
  #globe canvas { display:block; }

  /* 大气光晕（球体边缘柔光） */
  #glow {
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, transparent 42%, rgba(70,110,220,.10) 58%, rgba(40,70,160,.14) 72%, transparent 100%);
  }

  /* 加载提示 */
  #loading {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:500; color:#8fa3ff; font-size:14px; letter-spacing:1px;
    pointer-events:none; transition:opacity .6s;
  }
  #loading.hide { opacity:0; }

  /* 右下添加按钮 */
  #addBtn {
    position:absolute; right:20px; bottom:28px; z-index:1000;
    width:52px; height:52px; border-radius:50%; border:none;
    background:linear-gradient(135deg,#6c8cff,#4f6bf5);
    color:#fff; font-size:28px; line-height:1; cursor:pointer;
    box-shadow:0 6px 20px rgba(70,110,240,.5);
  }
  #addBtn:active { transform:scale(.94); }

  /* 图例弹层 */
  #legend {
    position:absolute; top:58px; right:14px; z-index:1000;
    background:rgba(18,22,42,.88); border:1px solid rgba(140,160,255,.22);
    border-radius:14px; padding:14px 16px; min-width:150px;
    box-shadow:0 8px 30px rgba(0,0,0,.55); backdrop-filter:blur(8px);
    display:none;
  }
  #legend.show { display:block; }
  #legend .row { display:flex; align-items:center; margin:8px 0; font-size:14px; color:#c8d2ff; }
  #legend .dot { width:14px; height:14px; border-radius:50%; margin-right:10px; flex:none; }
  #legend .note { font-size:11px; color:#7b87b8; margin-top:8px; line-height:1.5; }

  /* 底部面板 */
  #panel {
    position:absolute; left:0; right:0; bottom:0; z-index:1100;
    background:rgba(14,18,36,.94); border-top:1px solid rgba(140,160,255,.2);
    border-radius:20px 20px 0 0; padding:20px 20px 26px;
    transform:translateY(100%); transition:transform .32s ease;
    backdrop-filter:blur(10px);
  }
  #panel.open { transform:translateY(0); }
  #panel h3 { color:#e8ecff; font-size:16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  #panel .close { cursor:pointer; color:#8fa3ff; font-size:22px; padding:0 4px; }
  #searchBox {
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(140,160,255,.3);
    background:rgba(30,36,66,.7); color:#e6ebff; font-size:15px; outline:none;
  }
  #searchBox::placeholder { color:#6b76a8; }
  #candidates { margin-top:10px; max-height:230px; overflow-y:auto; }
  #candidates .item {
    padding:11px 14px; border-radius:10px; background:rgba(30,36,66,.55);
    margin-bottom:8px; cursor:pointer; font-size:14px; color:#e6ebff;
    border:1px solid rgba(140,160,255,.12);
  }
  #candidates .item:active { background:rgba(60,70,120,.7); }
  #candidates .item .sub { color:#7b87b8; font-size:12px; }
  #statusPick { display:flex; gap:10px; margin-top:12px; }
  .statusBtn {
    flex:1; padding:13px 0; border-radius:12px; border:1px solid rgba(140,160,255,.25);
    background:rgba(30,36,66,.6); color:#c8d2ff; font-size:15px; cursor:pointer; text-align:center;
  }
  .statusBtn.sel-want { background:rgba(255,213,79,.18); border-color:#ffd54f; color:#ffd54f; }
  .statusBtn.sel-visited { background:rgba(255,143,184,.18); border-color:#ff8fb8; color:#ff8fb8; }
  #editActions { display:flex; gap:10px; margin-top:14px; }
  #editActions button { flex:1; padding:13px 0; border-radius:12px; border:none; font-size:15px; cursor:pointer; }
  #btnSwitch { background:rgba(108,140,255,.2); color:#a8bcff; border:1px solid rgba(108,140,255,.4); }
  #btnDelete { background:rgba(255,107,107,.16); color:#ff9b9b; border:1px solid rgba(255,107,107,.4); }
  .hint { font-size:12px; color:#7b87b8; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div id="topbar">
  <div id="title">星星地图<span>第一期 · 单人版</span></div>
  <div id="legendBtn">图例</div>
</div>

<div id="globe"></div>
<div id="glow"></div>
<div id="loading">正在点亮地球…</div>

<button id="addBtn">+</button>

<div id="legend">
  <div class="row"><div class="dot" style="background:#ffd54f;box-shadow:0 0 8px #ffd54f"></div>想去</div>
  <div class="row"><div class="dot" style="background:#ff8fb8;box-shadow:0 0 8px #ff8fb8"></div>去过</div>
  <div class="row"><div class="dot" style="background:#fff;box-shadow:0 0 8px #fff"></div>朋友·想去</div>
  <div class="row"><div class="dot" style="background:#7cff8a;box-shadow:0 0 8px #7cff8a"></div>朋友·去过</div>
  <div class="note">白/绿两色，等双人版上线后开放<br>（蓝·一起去过 / 红·各自都去过 也在双人版）</div>
</div>

<div id="panel">
  <h3><span id="panelTitle">添加星星</span><span class="close" id="panelClose">×</span></h3>
  <div id="addArea">
    <input id="searchBox" placeholder="搜索城市 / 国家，比如「武汉」「东京」" autocomplete="off">
    <div id="candidates"></div>
    <div id="statusPick" style="display:none">
      <div class="statusBtn" id="pickWant">想去</div>
      <div class="statusBtn" id="pickVisited">去过</div>
    </div>
  </div>
  <div id="editArea" style="display:none">
    <div id="editInfo" style="font-size:14px;color:#c8d2ff;margin-bottom:4px;"></div>
    <div id="editActions">
      <button id="btnSwitch">切换状态</button>
      <button id="btnDelete">删除</button>
    </div>
  </div>
</div>

/* ========== 常量 ========== */
const STORAGE_KEY = "xixin_starmap_v1";
const COLORS = {
  want:"#ffd54f", visited:"#ff8fb8", friendWant:"#ffffff",
  friendVisited:"#7cff8a", together:"#5aa7ff", bothAlone:"#ff6b6b"
};
const EARTH_RADIUS = 1;
const STAR_OFFSET = 0.018;

/* ========== 数据读写 ========== */
function loadStars(){
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveStars(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
let stars = loadStars();

/* ========== 经纬度 → 球面坐标 ========== */
function latLngToPos(lat, lng, r){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ========== Three.js 场景 ========== */
const globeEl = document.getElementById("globe");
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
globeEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.copy(latLngToPos(30, 110, 2.9));

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.45;
controls.enablePan = false;
controls.minDistance = 1.45;
controls.maxDistance = 6;
controls.target.set(0,0,0);

/* 地球 */
const earthGroup = new THREE.Group();
scene.add(earthGroup);
const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
const earthMat = new THREE.MeshPhongMaterial({ color:0x2a3d5c, shininess:6 });
const earth = new THREE.Mesh(earthGeo, earthMat);
earthGroup.add(earth);

/* 光照：主光从一侧打过来，制造立体明暗 */
const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
sunLight.position.set(5, 2, 4);
scene.add(sunLight);
const ambient = new THREE.AmbientLight(0x5577aa, 0.75);
scene.add(ambient);

/* 大气层（略大半透明球，制造边缘光晕） */
const atmosGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.02, 96, 96);
const atmosMat = new THREE.MeshPhongMaterial({
  color:0x4477cc, transparent:true, opacity:0.07,
  side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false
});
const atmos = new THREE.Mesh(atmosGeo, atmosMat);
earthGroup.add(atmos);

/* 加载夜景纹理 */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin("anonymous");
const TEX_URLS = [
  "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg",
  "https://unpkg.com/three-globe/example/img/earth-night.jpg",
  "https://eoimages.gsfc.nasa.gov/images/imagerecords/79000/79765/dnb_land_ocean_ice.2012.3600x1800.jpg"
];
function tryTexture(i){
  if(i >= TEX_URLS.length){ fallbackTexture(); return; }
  texLoader.load(TEX_URLS[i],
    (tex)=>{ earthMat.map = tex; earthMat.color = new THREE.Color(0x7d94bf); earthMat.needsUpdate = true; hideLoading(); },
    undefined,
    ()=>{ tryTexture(i+1); }
  );
}
function fallbackTexture(){
  const c = document.createElement("canvas"); c.width=1024; c.height=512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#0a1530"; ctx.fillRect(0,0,1024,512);
  // 抽象大陆斑块（暗色，能看出轮廓）
  const blobs = [[260,180,130,70],[520,155,170,95],[720,205,95,60],[260,265,85,100],[460,275,105,80],[180,225,95,70],[135,200,60,95],[550,325,115,60],[910,135,45,45],[85,95,65,55]];
  blobs.forEach(b=>{
    ctx.fillStyle = "#16283f";
    ctx.beginPath(); ctx.ellipse(b[0],b[1],b[2],b[3],0,0,Math.PI*2); ctx.fill();
  });
  for(let i=0;i<4000;i++){
    const x=Math.random()*1024, y=Math.random()*512;
    ctx.fillStyle = Math.random()>0.5
      ? "rgba(255,200,120,"+(0.2+Math.random()*0.4)+")"
      : "rgba(150,180,255,"+(0.15+Math.random()*0.3)+")";
    ctx.fillRect(x,y,1.5,1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  earthMat.map = tex; earthMat.color = new THREE.Color(0xffffff); earthMat.needsUpdate = true;
  hideLoading();
}
function hideLoading(){ document.getElementById("loading").classList.add("hide"); }
tryTexture(0);

/* ========== 星星 ========== */
const starSprites = [];
const starGroup = new THREE.Group();
earthGroup.add(starGroup);

function makeGlowTexture(color){
  const c = document.createElement("canvas"); c.width=128; c.height=128;
  const ctx = c.getContext("2d");
  const r=parseInt(color.slice(1,3),16), g=parseInt(color.slice(3,5),16), b=parseInt(color.slice(5,7),16);
  const grd = ctx.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0, "rgba("+r+","+g+","+b+",1)");
  grd.addColorStop(0.25, "rgba("+r+","+g+","+b+",0.75)");
  grd.addColorStop(0.6, "rgba("+r+","+g+","+b+",0.18)");
  grd.addColorStop(1, "rgba("+r+","+g+","+b+",0)");
  ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

function addStarSprite(s){
  const color = COLORS[s.status] || COLORS.want;
  const mat = new THREE.SpriteMaterial({
    map:makeGlowTexture(color), transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending
  });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(latLngToPos(s.lat, s.lng, EARTH_RADIUS + STAR_OFFSET));
  sprite.scale.set(0.038, 0.038, 1);
  sprite.userData.id = s.id;
  sprite.userData.phase = Math.random() * Math.PI * 2;
  starGroup.add(sprite);
  return sprite;
}

function renderStars(){
  starGroup.children.forEach(c=>{ starGroup.remove(c); if(c.material && c.material.map) c.material.map.dispose(); if(c.material) c.material.dispose(); });
  starSprites.length = 0;
  stars.forEach(s => { starSprites.push(addStarSprite(s)); });
}

/* ========== 点击检测（区分点击与拖动） ========== */
const raycaster = new THREE.Raycaster();
let pointerDown = null;
renderer.domElement.addEventListener("pointerdown", (e)=>{ pointerDown = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener("pointerup", (e)=>{
  if(!pointerDown) return;
  const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
  pointerDown = null;
  if(Math.sqrt(dx*dx + dy*dy) > 7) return;
  handleTap(e);
});

function handleTap(e){
  const rect = renderer.domElement.getBoundingClientRect();
  const mx = ((e.clientX - rect.left)/rect.width)*2 - 1;
  const my = -((e.clientY - rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);
  const hits = raycaster.intersectObjects(starSprites, false);
  if(hits.length > 0){
    openEdit(hits[0].object.userData.id);
  } else {
    document.getElementById("legend").classList.remove("show");
  }
}

/* ========== 相机平滑飞向城市 ========== */
let camStart=null, camEnd=null, camT=0;
function flyToCity(lat, lng){
  camStart = camera.position.clone();
  camEnd = latLngToPos(lat, lng, Math.max(camera.position.length(), 2.2));
  camT = 0;
}

/* ========== 面板控制 ========== */
const panel = document.getElementById("panel");
const addArea = document.getElementById("addArea");
const editArea = document.getElementById("editArea");
const panelTitle = document.getElementById("panelTitle");
function openPanel(){ panel.classList.add("open"); }
function closePanel(){ panel.classList.remove("open"); }

let pickedCity = null, pickedStatus = "want", editingId = null;

function enterAdd(){
  pickedCity = null; pickedStatus = "want";
  addArea.style.display = "block"; editArea.style.display = "none";
  panelTitle.textContent = "添加星星";
  document.getElementById("searchBox").value = "";
  document.getElementById("candidates").innerHTML = "";
  document.getElementById("statusPick").style.display = "none";
  openPanel();
  setTimeout(()=> document.getElementById("searchBox").focus(), 300);
}

const searchBox = document.getElementById("searchBox");
const candidates = document.getElementById("candidates");
const statusPick = document.getElementById("statusPick");

searchBox.addEventListener("input", ()=>{
  const q = searchBox.value.trim();
  pickedCity = null; statusPick.style.display = "none";
  if(!q){ candidates.innerHTML = ""; return; }
  const list = CITY_DATA.filter(c => c.name.includes(q) || c.c.includes(q)).slice(0,8);
  candidates.innerHTML = list.map((c,i)=>
    '<div class="item" data-i="'+i+'">'+c.name+'<span class="sub"> · '+c.c+'</span></div>'
  ).join("") || '<div class="hint">没搜到，试试别的写法</div>';
  list.forEach((c,i)=>{
    const el = candidates.querySelector('[data-i="'+i+'"]');
    if(el) el.addEventListener("click", ()=> pickCity(c));
  });
});

function pickCity(c){
  pickedCity = c;
  searchBox.value = c.name;
  candidates.innerHTML = "";
  statusPick.style.display = "flex";
  document.getElementById("pickWant").className = "statusBtn sel-want";
  document.getElementById("pickVisited").className = "statusBtn";
  pickedStatus = "want";
  flyToCity(c.lat, c.lng);
}

document.getElementById("pickWant").addEventListener("click", ()=>{
  pickedStatus = "want";
  document.getElementById("pickWant").className = "statusBtn sel-want";
  document.getElementById("pickVisited").className = "statusBtn";
});
document.getElementById("pickVisited").addEventListener("click", ()=>{
  pickedStatus = "visited";
  document.getElementById("pickVisited").className = "statusBtn sel-visited";
  document.getElementById("pickWant").className = "statusBtn";
});
statusPick.addEventListener("click", (e)=>{
  if(e.target.classList.contains("statusBtn") && pickedCity){
    addStar(pickedCity, pickedStatus);
  }
});

function addStar(city, status){
  const id = Date.now() + "" + Math.floor(Math.random()*1000);
  stars.push({ id, name:city.name, lat:city.lat, lng:city.lng, status });
  saveStars(stars);
  renderStars();
  closePanel();
  flyToCity(city.lat, city.lng);
}

function openEdit(id){
  const s = stars.find(x=> x.id === id);
  if(!s) return;
  editingId = id;
  addArea.style.display = "none"; editArea.style.display = "block";
  panelTitle.textContent = s.name;
  document.getElementById("editInfo").textContent = "当前状态：" + (s.status === "visited" ? "去过 · 粉星" : "想去 · 黄星");
  document.getElementById("btnSwitch").textContent = s.status === "visited" ? "改成「想去」" : "改成「去过」";
  openPanel();
}

document.getElementById("btnSwitch").addEventListener("click", ()=>{
  const s = stars.find(x=> x.id === editingId);
  if(!s) return;
  s.status = s.status === "visited" ? "want" : "visited";
  saveStars(stars); renderStars(); closePanel();
});
document.getElementById("btnDelete").addEventListener("click", ()=>{
  stars = stars.filter(x=> x.id !== editingId);
  saveStars(stars); renderStars(); closePanel();
});

document.getElementById("addBtn").addEventListener("click", enterAdd);
document.getElementById("panelClose").addEventListener("click", closePanel);
document.getElementById("legendBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  document.getElementById("legend").classList.toggle("show");
});

/* ========== 响应式 ========== */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ========== 动画循环 ========== */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for(let i=0;i<starSprites.length;i++){
    const sp = starSprites[i];
    const breathe = 0.72 + 0.28 * Math.sin(t*1.4 + sp.userData.phase);
    sp.material.opacity = 0.45 + 0.55 * breathe;
    const s = 0.034 + 0.01 * Math.sin(t*1.4 + sp.userData.phase);
    sp.scale.set(s, s, 1);
  }

  if(camStart){
    camT += 0.025;
    if(camT >= 1){ camera.position.copy(camEnd); camStart = null; }
    else {
      const e = camT*camT*(3 - 2*camT);
      camera.position.lerpVectors(camStart, camEnd, e);
    }
    camera.lookAt(0,0,0);
    controls.update();
  }

  controls.update();
  renderer.render(scene, camera);
}

renderStars();
animate();
